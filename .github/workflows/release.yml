name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      date: ${{ steps.meta.outputs.date }}
      commit: ${{ steps.meta.outputs.commit }}
      image: ${{ steps.meta.outputs.image }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate protected tag, changelog and source
        id: meta
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py validate "$TAG"
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
          python3 - <<'PYCODE'
          import datetime,json,os,subprocess
          tag=os.environ['TAG'];repo=os.environ['REPOSITORY']
          check=subprocess.run(['gh','api',f'repos/{repo}/releases/tags/{tag}'],text=True,capture_output=True)
          if check.returncode==0:
              if not json.loads(check.stdout)['draft']:raise SystemExit('Release already published; use a new version')
          elif 'HTTP 404' not in check.stderr:
              raise SystemExit(check.stderr)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          epoch=int(subprocess.check_output(['git','show','-s','--format=%ct','HEAD'],text=True))
          date=datetime.datetime.fromtimestamp(epoch,datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for key,value in {'version':tag[1:],'date':date,'commit':sha,'image':'ghcr.io/'+repo.lower(),'prerelease':str('-' in tag).lower()}.items():
                  f.write(key+'='+value+'\n')
          PYCODE
  verify:
    needs: metadata
    uses: ./.github/workflows/verify.yml
    with:
      release-tag: ${{ github.ref_name }}
  images:
    needs: [metadata, verify]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64, variant: server, file: Dockerfile, kind: server, jdk: ''}
          - {runner: ubuntu-24.04-arm, arch: arm64, variant: server, file: Dockerfile, kind: server, jdk: ''}
          - {runner: ubuntu-24.04, arch: amd64, variant: diagnostic17, file: Dockerfile.diagnostic, kind: diagnostic, jdk: eclipse-temurin:17-jdk-jammy}
          - {runner: ubuntu-24.04-arm, arch: arm64, variant: diagnostic17, file: Dockerfile.diagnostic, kind: diagnostic, jdk: eclipse-temurin:17-jdk-jammy}
          - {runner: ubuntu-24.04, arch: amd64, variant: diagnostic25, file: Dockerfile.diagnostic, kind: diagnostic, jdk: eclipse-temurin:25-jdk-jammy}
          - {runner: ubuntu-24.04-arm, arch: arm64, variant: diagnostic25, file: Dockerfile.diagnostic, kind: diagnostic, jdk: eclipse-temurin:25-jdk-jammy}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      IMAGE: ${{ needs.metadata.outputs.image }}
      VERSION: ${{ needs.metadata.outputs.version }}
      COMMIT: ${{ needs.metadata.outputs.commit }}
      BUILD_DATE: ${{ needs.metadata.outputs.date }}
      VARIANT: ${{ matrix.variant }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
      - name: Build once and test the image that will be pushed
        env:
          DOCKERFILE: ${{ matrix.file }}
          JDK_IMAGE: ${{ matrix.jdk }}
          KIND: ${{ matrix.kind }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          args=()
          if [ -n "$JDK_IMAGE" ]; then args+=(--build-arg "JDK_IMAGE=$JDK_IMAGE"); fi
          docker buildx build --load --provenance=false -f "$DOCKERFILE" -t jvmdiag:candidate             --build-arg "VERSION=$VERSION" --build-arg "COMMIT=$COMMIT" --build-arg "BUILD_DATE=$BUILD_DATE"             --build-arg "SOURCE_URL=$SOURCE_URL" "${args[@]}" .
          python3 scripts/container_smoke.py --image jvmdiag:candidate --kind "$KIND" --version "$VERSION"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push only the tested native image to a unique staging tag
        run: |
          tag="$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$VARIANT-$ARCH"
          docker tag jvmdiag:candidate "$tag"
          docker push "$tag"
          export CANDIDATE="$tag"
          python3 - <<'PYCODE'
          import json,os,pathlib,subprocess
          raw=subprocess.check_output(['docker','buildx','imagetools','inspect',os.environ['CANDIDATE'],'--format','{{json .Manifest}}'],text=True)
          digest=json.loads(raw)['digest']
          pathlib.Path('images').mkdir()
          data={key:os.environ[key] for key in ('IMAGE','VERSION','COMMIT','VARIANT','ARCH')}
          data['digest']=digest
          pathlib.Path('images',data['VARIANT']+'-'+data['ARCH']+'.json').write_text(json.dumps(data))
          PYCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.variant }}-${{ matrix.arch }}
          path: images/*.json
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [metadata, verify, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      IMAGE: ${{ needs.metadata.outputs.image }}
      COMMIT: ${{ needs.metadata.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: images
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate the complete tested artifact set and prepare a draft
        run: |
          python3 scripts/release.py collect dist
          python3 scripts/release_notes.py --tag "$TAG" --commit "$COMMIT" --image "$IMAGE" --out release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
            gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS dist/release.json --clobber
            gh release edit "$TAG" --notes-file release-notes.md --prerelease="$(if [[ "$TAG" == *-* ]]; then echo true; else echo false; fi)"
          else
            args=()
            if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file release-notes.md "${args[@]}"               dist/*.tar.gz dist/*.zip dist/SHA256SUMS dist/release.json
          fi
      - name: Attest the exact archives and checksum manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/release.json
      - name: Promote tested image digests to multi-architecture version tags
        id: promote
        run: python3 scripts/promote_images.py --directory images --image "$IMAGE" --tag "$TAG" --commit "$COMMIT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.promote.outputs.server }}
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.promote.outputs.diagnostic17 }}
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.promote.outputs.diagnostic25 }}
          push-to-registry: true
      - name: Update stable aliases without promoting prereleases or downgrading newer releases
        id: aliases
        run: python3 scripts/promote_images.py --directory images --image "$IMAGE" --tag "$TAG" --commit "$COMMIT" --aliases
      - name: Publish the fully prepared release
        env:
          MAKE_LATEST: ${{ steps.aliases.outputs.latest }}
        run: gh release edit "$TAG" --draft=false --latest="$MAKE_LATEST"

# Optional. Supply proxy settings to the server process, not just the browser.
apiVersion: v1
kind: Secret
metadata:
  name: jvmdiag-proxy
type: Opaque
stringData:
  HTTP_PROXY: http://proxy.corp.example:3128
  HTTPS_PROXY: http://proxy.corp.example:3128
  NO_PROXY: localhost,127.0.0.1,.svc,.cluster.local

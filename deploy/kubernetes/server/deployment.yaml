apiVersion: apps/v1
kind: Deployment
metadata:
  name: jvmdiag
  labels:
    app.kubernetes.io/name: jvmdiag
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jvmdiag
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jvmdiag
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: jvmdiag
        image: ghcr.io/bishoku/jvmdiag:0.0.4
        imagePullPolicy: IfNotPresent
        args:
        - serve
        - --host
        - 0.0.0.0
        - --port
        - '8080'
        - --multi-user
        - --max-workers
        - '1'
        - --data-dir
        - /data
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - secretRef:
            name: jvmdiag-access
        - secretRef:
            name: jvmdiag-proxy
            optional: true
        env:
        - name: DYNAMIC_MAX_MAT_MEMORY
          value: 2g
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: '2'
            memory: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 30
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: jvmdiag-data
      - name: tmp
        emptyDir:
          sizeLimit: 2Gi
